name: Metrics
on:
  # Schedule updates daily at midnight UTC
  schedule:
    - cron: "0 0 * * *"
  # Automatically run on pushes to main
  push:
    branches:
      - main
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate GitHub Metrics
        uses: lowlighter/metrics@latest
        with:
          # Your GitHub personal access token (recommended in repo secrets as METRICS_TOKEN)
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: T-ARK
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata

          # 🔭 Starred topics plugin
          plugin_topics: yes
          plugin_topics_mode: starred
          plugin_topics_limit: 28

          # 📅 3D Isometric Calendar plugin
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # 📈 Habits & Activity monitoring
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_charts: yes

          # 🎯 Followup & Workflows
          plugin_followup: yes
          plugin_followup_sections: user

          # 💻 Languages & Lines breakdown
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_lines: yes
