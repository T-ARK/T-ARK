name: Metrics
on:
  schedule:
    - cron: "0 */6 * * *"   # refresh every 6 hours
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      # 1. Overview: header, activity, languages, habits
      - name: Overview & Habits
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: T-ARK
          template: classic
          filename: metrics/github-metrics.svg
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_charts: yes
          commit_message: "chore: update metrics overview [skip ci]"

      # 2. Isometric full-year contribution calendar
      - name: 3D Isometric Calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: T-ARK
          template: classic
          filename: metrics/isocalendar.fullyear.svg
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          commit_message: "chore: update isocalendar [skip ci]"

      # 3. Stargazers Worldmap
      - name: Stargazers Worldmap
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: T-ARK
          template: classic
          filename: metrics/stargazers.worldmap.svg
          base: ""
          plugin_stargazers: yes
          plugin_stargazers_charts: no
          plugin_stargazers_worldmap: yes
          commit_message: "chore: update stargazers worldmap [skip ci]"

      # 4. Stock / Telemetry Chart
      - name: Stock & Telemetry
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: T-ARK
          template: classic
          filename: metrics/stock.svg
          base: ""
          plugin_stock: yes
          commit_message: "chore: update stock telemetry [skip ci]"

      # 5. Pinned repositories
      - name: Pinned Repositories
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: T-ARK
          template: classic
          filename: metrics/pinned.svg
          base: ""
          plugin_pinned: yes
          plugin_pinned_limit: 6
          commit_message: "chore: update pinned [skip ci]"
