name: Metrics
on:
  schedule:
    - cron: "0 */6 * * *"   # refresh every 6 hours
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      # 1. Overview: header, activity, languages, habits
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: T-ARK
          template: classic
          filename: metrics/github-metrics.svg
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_charts: yes
          commit_message: "chore: update metrics [skip ci]"

      # 2. Isometric contribution calendar
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: T-ARK
          template: classic
          filename: metrics/isocalendar.svg
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          commit_message: "chore: update isocalendar [skip ci]"

      # 3. Pinned repositories (featured projects)
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: T-ARK
          template: classic
          filename: metrics/pinned.svg
          base: ""
          plugin_pinned: yes
          plugin_pinned_limit: 6
          commit_message: "chore: update pinned [skip ci]"
