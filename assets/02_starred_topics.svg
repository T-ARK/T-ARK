    <text x="24" y="-1" class="font-sans" font-size="15" font-weight="700" fill="#38bdf8">Starred topics</text>
  </g>

  <!-- Icons Wall Matrix (4 Rows x 14 Columns) -->
  <g transform="translate(18, 38)">
