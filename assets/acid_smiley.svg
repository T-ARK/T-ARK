<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="120" height="120" fill="#000000" rx="16" />
  <g transform="translate(10, 10)" filter="url(#glow)">
    <!-- Face outline -->
    <circle cx="50" cy="50" r="42" fill="none" stroke="#00FF66" stroke-width="4.5" />
    <!-- Eyes -->
    <circle cx="36" cy="38" r="5" fill="#00FF66" />
    <circle cx="64" cy="38" r="5" fill="#00FF66" />
    <!-- Smile -->
    <path d="M 32 58 Q 50 78 68 58" fill="none" stroke="#00FF66" stroke-width="4.5" stroke-linecap="round" />
    <!-- Drips -->
    <path d="M 50 70 L 50 96 C 50 98 47 98 47 96 L 47 70" fill="#00FF66" />
    <path d="M 64 62 L 64 88 C 64 90 61 90 61 88 L 61 62" fill="#00FF66" />
    <path d="M 36 62 L 36 82 C 36 84 33 84 33 82 L 33 62" fill="#00FF66" />
  </g>
</svg>
